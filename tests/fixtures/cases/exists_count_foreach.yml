version: 1
cases:
- id: C340
  name: exists subquery outbound
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (u:User) WHERE EXISTS { MATCH (u)-[:FOLLOWS]->(m:User) } RETURN u.name

    '
  expected:
    aql: |
      WITH @@withCollection0, @@withCollection1, @@withCollection2, @@collection
      FOR u IN @@collection
        FILTER (LENGTH(FOR _sq_m, _sq_r IN 1..1 OUTBOUND u @@edgeCollection FILTER IS_SAME_COLLECTION(@vCollection, _sq_m) RETURN 1) > 0)
        RETURN u.name
    bind_vars:
      "@collection": users
      "@edgeCollection": follows
      vCollection: users
      "@withCollection0": docs
      "@withCollection1": persons
      "@withCollection2": places
- id: C341
  name: exists subquery negated
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (u:User) WHERE NOT EXISTS { MATCH (u)-[:FOLLOWS]->(m:User) } RETURN u.name

    '
  expected:
    aql: |
      WITH @@withCollection0, @@withCollection1, @@withCollection2, @@collection
      FOR u IN @@collection
        FILTER (NOT (LENGTH(FOR _sq_m, _sq_r IN 1..1 OUTBOUND u @@edgeCollection FILTER IS_SAME_COLLECTION(@vCollection, _sq_m) RETURN 1) > 0))
        RETURN u.name
    bind_vars:
      "@collection": users
      "@edgeCollection": follows
      vCollection: users
      "@withCollection0": docs
      "@withCollection1": persons
      "@withCollection2": places
- id: C342
  name: count subquery in return
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (u:User) RETURN u.name, COUNT { MATCH (u)-[:FOLLOWS]->(m:User) } AS followerCount

    '
  expected:
    aql: |
      WITH @@withCollection0, @@withCollection1, @@withCollection2, @@collection
      FOR u IN @@collection
        RETURN {name: u.name, followerCount: LENGTH(FOR _sq_m, _sq_r IN 1..1 OUTBOUND u @@edgeCollection FILTER IS_SAME_COLLECTION(@vCollection, _sq_m) RETURN 1)}
    bind_vars:
      "@collection": users
      "@edgeCollection": follows
      vCollection: users
      "@withCollection0": docs
      "@withCollection1": persons
      "@withCollection2": places
