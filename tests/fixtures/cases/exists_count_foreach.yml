        FILTER (LENGTH(FOR _sq_m, _sq_r IN 1..1 OUTBOUND u @@edgeCollection FILTER IS_SAME_COLLECTION(@vCollection, _sq_m) RETURN 1) > 5)
        RETURN u.name
    bind_vars:
