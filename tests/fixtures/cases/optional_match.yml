version: 1
cases:
- id: C214
  name: Sole OPTIONAL MATCH node with WHERE (bare return)
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'OPTIONAL MATCH (n:User) WHERE n.id = "u1" RETURN n

    '
  expected:
    aql: "LET _opt_rows = (\nFOR n IN @@tailCollection\n  FILTER (n.id == \"u1\")\n  RETURN {n: n}\n  )\n  FOR _opt_row IN (LENGTH(_opt_rows) > 0 ? _opt_rows : [{}])\n    LET n = _opt_row.n\n    RETURN n\n"
    bind_vars:
      "@tailCollection": users
- id: C215
  name: Sole OPTIONAL MATCH node projected
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'OPTIONAL MATCH (n:User) RETURN n.name AS name

    '
  expected:
    aql: "LET _opt_rows = (\nFOR n IN @@tailCollection\n  RETURN {n: n}\n  )\n  FOR _opt_row IN (LENGTH(_opt_rows) > 0 ? _opt_rows : [{}])\n    LET n = _opt_row.n\n    RETURN {name: n.name}\n"
    bind_vars:
      "@tailCollection": users
- id: C216
  name: Sole OPTIONAL MATCH relationship pattern projected
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'OPTIONAL MATCH (u:User)-[r:FOLLOWS]->(v:User) RETURN u.name AS from_name, v.name AS to_name

    '
  expected:
    aql: "WITH @@withCollection0, @@withCollection1, @@withCollection2, @@tailCollection\nLET _opt_rows = (\nFOR u IN @@tailCollection\n  FOR v, r IN 1..1 OUTBOUND u @@edgeCollection\n    FILTER IS_SAME_COLLECTION(@vCollection, v)\n    RETURN {u: u, v: v, r: r}\n    )\n    FOR _opt_row IN (LENGTH(_opt_rows) > 0 ? _opt_rows : [{}])\n      LET u = _opt_row.u\n      LET v = _opt_row.v\n      LET r = _opt_row.r\n      RETURN {from_name: u.name, to_name: v.name}\n"
    bind_vars:
      "@tailCollection": users
      "@edgeCollection": follows
      vCollection: users
      "@withCollection0": docs
      "@withCollection1": persons
      "@withCollection2": places
