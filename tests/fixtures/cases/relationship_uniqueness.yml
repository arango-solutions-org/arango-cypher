version: 1
cases:
- id: C720
  name: two named rels get uniqueness filter
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (a:User)-[r1:FOLLOWS]->(b:User)-[r2:FOLLOWS]->(c:User) RETURN a.id, c.id

    '
  expected:
    aql: "WITH @@withCollection0, @@withCollection1, @@withCollection2, @@uCollection\nFOR a IN @@uCollection\n  FOR c, r2,\
      \ _path IN 2..2 OUTBOUND a @@edgeCollection\n    LET b = _path.vertices[1]\n\
      \    LET r1 = _path.edges[0]\n    FILTER IS_SAME_COLLECTION(@vCollection, b)\n\
      \    FILTER IS_SAME_COLLECTION(@vCollection2, c)\n    FILTER r1._id != r2._id\n\
      \    RETURN {id: a.id, c_id: c.id}"
    bind_vars:
      '@uCollection': users
      '@edgeCollection': follows
      vCollection: users
      vCollection2: users
      '@withCollection0': docs
      '@withCollection1': persons
      '@withCollection2': places
- id: C721
  name: multi-pattern two named rels get uniqueness filter
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (a:User)-[r1:FOLLOWS]->(b:User), (b)-[r2:FOLLOWS]->(c:User) RETURN a.id, b.id, c.id

    '
  expected:
    aql: "WITH @@withCollection0, @@withCollection1, @@withCollection2, @@aCollection\nFOR a IN @@aCollection\n  FOR b, r1 IN\
      \ 1..1 OUTBOUND a @@edgeCollection\n    FILTER IS_SAME_COLLECTION(@bCollection,\
      \ b)\n    FOR c, r2 IN 1..1 OUTBOUND b @@edgeCollection2\n      FILTER IS_SAME_COLLECTION(@cCollection,\
      \ c)\n      FILTER r1._id != r2._id\n      RETURN {id: a.id, b_id: b.id, c_id:\
      \ c.id}"
    bind_vars:
      '@aCollection': users
      '@edgeCollection': follows
      bCollection: users
      '@edgeCollection2': follows
      cCollection: users
      '@withCollection0': docs
      '@withCollection1': persons
      '@withCollection2': places
- id: C1417
  name: unnamed relationships in different pattern parts are distinct
  mapping_fixture: pg
  extensions_enabled: false
  cypher: |
    MATCH (u:User)-[:FOLLOWS]->(v:User), (w:User)-[:FOLLOWS]->(v)
    RETURN u.id AS u, w.id AS w
  expected:
    aql: |
      WITH @@withCollection0, @@withCollection1, @@withCollection2, @@uCollection
      FOR u IN @@uCollection
        FOR v, r IN 1..1 OUTBOUND u @@edgeCollection
          FILTER IS_SAME_COLLECTION(@vCollection, v)
          FOR w, r2 IN 1..1 INBOUND v @@edgeCollection2
            FILTER IS_SAME_COLLECTION(@wCollection, w)
            FILTER r._id != r2._id
            RETURN {u: u.id, w: w.id}
    bind_vars:
      "@uCollection": users
      "@edgeCollection": follows
      vCollection: users
      "@edgeCollection2": follows
      wCollection: users
      "@withCollection0": docs
      "@withCollection1": persons
      "@withCollection2": places
- id: C1418
  name: relationships in different MATCH clauses may be the same edge
  mapping_fixture: pg
  extensions_enabled: false
  cypher: |
    MATCH (u:User)-[a:FOLLOWS]->(v:User)
    MATCH (w:User)-[b:FOLLOWS]->(v)
    RETURN u.id AS u, w.id AS w
  expected:
    aql: |
      WITH @@withCollection0, @@withCollection1, @@withCollection2, @@uCollection
      FOR u IN @@uCollection
        FOR v, a IN 1..1 OUTBOUND u @@edgeCollection
          FILTER IS_SAME_COLLECTION(@vCollection, v)
          FOR w, b IN 1..1 INBOUND v @@edgeCollection2
            FILTER IS_SAME_COLLECTION(@wCollection, w)
            RETURN {u: u.id, w: w.id}
    bind_vars:
      "@uCollection": users
      "@edgeCollection": follows
      vCollection: users
      "@edgeCollection2": follows
      wCollection: users
      "@withCollection0": docs
      "@withCollection1": persons
      "@withCollection2": places
