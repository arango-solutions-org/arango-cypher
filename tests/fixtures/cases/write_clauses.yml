version: 1
cases:
# ─── SET ───────────────────────────────────────────────────────
- id: C400
  name: SET single property
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (n:Person {name: "Alice"}) SET n.name = "Bob"

    '
  expected:
    aql: "FOR n IN @@collection\n  FILTER (n.name == \"Alice\")\n  UPDATE n WITH {name: \"Bob\"} IN @@collection\n"
    bind_vars:
      "@collection": persons
- id: C401
  name: SET multiple properties in one SET clause
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (n:Person {name: "Alice"}) SET n.name = "Bob", n.age = 30

    '
  expected:
    aql: "FOR n IN @@collection\n  FILTER (n.name == \"Alice\")\n  UPDATE n WITH {name: \"Bob\", age: 30} IN @@collection\n"
    bind_vars:
      "@collection": persons
- id: C402
  name: SET += merge semantics
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (n:Person {name: "Alice"}) SET n += {name: "Bob", age: 30}

    '
  expected:
    aql: "FOR n IN @@collection\n  FILTER (n.name == \"Alice\")\n  UPDATE n WITH MERGE(n, {name: \"Bob\", age: 30}) IN @@collection\n"
    bind_vars:
      "@collection": persons
- id: C403
  name: SET = replace semantics
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (n:Person {name: "Alice"}) SET n = {name: "Bob"}

    '
  expected:
    aql: "FOR n IN @@collection\n  FILTER (n.name == \"Alice\")\n  REPLACE n WITH {name: \"Bob\"} IN @@collection\n"
    bind_vars:
      "@collection": persons
- id: C404
  name: SET with LPG label filter
  mapping_fixture: lpg
  extensions_enabled: false
  cypher: 'MATCH (n:User {name: "Alice"}) SET n.name = "Bob"

    '
  expected:
    aql: "FOR n IN @@collection\n  FILTER n[@typeField] == @typeValue\n  FILTER (n.name == \"Alice\")\n  UPDATE n WITH {name: \"Bob\"} IN @@collection\n"
    bind_vars:
      "@collection": vertices
      typeField: type
      typeValue: User
- id: C405
  name: SET with RETURN
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (n:Person {name: "Alice"}) SET n.name = "Bob" RETURN n

    '
  expected:
    aql: "FOR n IN @@collection\n  FILTER (n.name == \"Alice\")\n  UPDATE n WITH {name: \"Bob\"} IN @@collection\n  LET n_new = NEW\n  RETURN n_new\n"
    bind_vars:
      "@collection": persons
# ─── DELETE ────────────────────────────────────────────────────
- id: C410
  name: DELETE node
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (n:Person {name: "Alice"}) DELETE n

    '
  expected:
    aql: "LET _matched = (\nFOR n IN @@collection\n  FILTER (n.name == \"Alice\")\n  RETURN {n: n, _row: true}\n  )\n  LET _deleted_nodes = UNIQUE(REMOVE_VALUE(FLATTEN(_matched[*].n._id), null))\n  FOR _id IN _deleted_nodes FILTER PARSE_IDENTIFIER(_id).collection == @deleteNodesName REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteNodes\n"
    bind_vars:
      "@collection": persons
      "@deleteNodes": persons
      deleteNodesName: persons
- id: C411
  name: DETACH DELETE node (PG)
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (n:Person {name: "Alice"}) DETACH DELETE n

    '
  expected:
    aql: "WITH @@withCollection0, @@collection, @@withCollection1, @@withCollection2\nLET _matched = (\nFOR n IN @@collection\n  FILTER (n.name == \"Alice\")\n  RETURN {n: n, _row: true}\n  )\n  LET _deleted_nodes = UNIQUE(REMOVE_VALUE(FLATTEN(_matched[*].n._id), null))\n  LET _detach0 = (FOR _n IN _deleted_nodes FOR _x, _e IN 1..1 ANY _n @@deleteEdges RETURN _e._id)\n  LET _deleted_edges = UNIQUE(_detach0)\n  LET _removed0 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdgesName REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges)\n  FOR _id IN _deleted_nodes FILTER PARSE_IDENTIFIER(_id).collection == @deleteNodesName REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteNodes\n"
    bind_vars:
      "@collection": persons
      "@deleteEdges": follows
      deleteEdgesName: follows
      "@deleteNodes": persons
      deleteNodesName: persons
      "@withCollection0": docs
      "@withCollection1": places
      "@withCollection2": users
- id: C412
  name: DETACH DELETE node (LPG)
  mapping_fixture: lpg
  extensions_enabled: false
  cypher: 'MATCH (n:User {name: "Alice"}) DETACH DELETE n

    '
  expected:
    aql: "WITH @@collection\nLET _matched = (\nFOR n IN @@collection\n  FILTER n[@typeField] == @typeValue\n  FILTER (n.name == \"Alice\")\n  RETURN {n: n, _row: true}\n  )\n  LET _deleted_nodes = UNIQUE(REMOVE_VALUE(FLATTEN(_matched[*].n._id), null))\n  LET _detach0 = (FOR _n IN _deleted_nodes FOR _x, _e IN 1..1 ANY _n @@deleteEdges RETURN _e._id)\n  LET _deleted_edges = UNIQUE(_detach0)\n  LET _removed0 = (FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdgesName REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges)\n  FOR _id IN _deleted_nodes FILTER PARSE_IDENTIFIER(_id).collection == @deleteNodesName REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteNodes\n"
    bind_vars:
      "@collection": vertices
      typeField: type
      typeValue: User
      "@deleteEdges": edges
      deleteEdgesName: edges
      "@deleteNodes": vertices
      deleteNodesName: vertices
- id: C413
  name: DELETE with RETURN of a deleted property (DeletedEntityAccess per row)
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (n:Person {name: "Alice"}) DELETE n RETURN n.name

    '
  expected:
    aql: "LET _matched = (\nFOR n IN @@collection\n  FILTER (n.name == \"Alice\")\n  RETURN {n: n, _row: true}\n  )\n  LET _deleted_nodes = UNIQUE(REMOVE_VALUE(FLATTEN(_matched[*].n._id), null))\n  LET _removed0 = (FOR _id IN _deleted_nodes FILTER PARSE_IDENTIFIER(_id).collection == @deleteNodesName REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteNodes)\n  FOR _row IN _matched\n    LET n = _row.n\n    FILTER n == null OR FAIL(\"DeletedEntityAccess: the query reads a property or the labels of a node or relationship it deleted\")\n    RETURN n.name\n"
    bind_vars:
      "@collection": persons
      "@deleteNodes": persons
      deleteNodesName: persons
# ─── MERGE ─────────────────────────────────────────────────────
- id: C420
  name: MERGE basic node upsert (PG)
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MERGE (n:Person {name: "Alice"})

    '
  expected:
    aql: "UPSERT {name: \"Alice\"}\nINSERT {name: \"Alice\"}\nUPDATE {}\nIN @@collection\n"
    bind_vars:
      '@collection': persons
- id: C421
  name: MERGE basic node upsert (LPG)
  mapping_fixture: lpg
  extensions_enabled: false
  cypher: 'MERGE (n:User {name: "Alice"})

    '
  expected:
    aql: "UPSERT {type: @typeValue, name: \"Alice\"}\nINSERT {type: @typeValue, name: \"Alice\"}\nUPDATE {}\nIN @@collection\n"
    bind_vars:
      '@collection': vertices
      typeValue: User
- id: C422
  name: MERGE with ON CREATE SET
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MERGE (n:Person {name: "Alice"}) ON CREATE SET n.created = timestamp()

    '
  expected:
    aql: "UPSERT {name: \"Alice\"}\nINSERT {name: \"Alice\", created: DATE_NOW()}\nUPDATE {}\nIN @@collection\n"
    bind_vars:
      '@collection': persons
- id: C423
  name: MERGE with ON MATCH SET
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MERGE (n:Person {name: "Alice"}) ON MATCH SET n.updated = timestamp()

    '
  expected:
    aql: "UPSERT {name: \"Alice\"}\nINSERT {name: \"Alice\"}\nUPDATE {updated: DATE_NOW()}\nIN @@collection\n"
    bind_vars:
      '@collection': persons
- id: C424
  name: MERGE with ON CREATE SET and ON MATCH SET
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MERGE (n:Person {name: "Alice"}) ON CREATE SET n.created = timestamp() ON MATCH SET n.updated = timestamp()

    '
  expected:
    aql: "UPSERT {name: \"Alice\"}\nINSERT {name: \"Alice\", created: DATE_NOW()}\nUPDATE {updated: DATE_NOW()}\nIN @@collection\n"
    bind_vars:
      '@collection': persons
# ─── MERGE relationship ───────────────────────────────────────
- id: C425
  name: MERGE relationship after MATCH (PG DEDICATED_COLLECTION)
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (a:Person {name: "Alice"}), (b:Person {name: "Bob"})
    MERGE (a)-[:FOLLOWS {since: 2020}]->(b)

    '
  expected:
    aql: "FOR a IN @@collection\n  FILTER (a.name == \"Alice\")\n  FOR b IN @@collection2\n    FILTER (b.name == \"Bob\")\n    UPSERT {_from: a._id, _to: b._id, since: 2020}\n    INSERT {_from: a._id, _to: b._id, since: 2020}\n    UPDATE {}\n    IN @@edgeCollection\n"
    bind_vars:
      "@edgeCollection": follows
      "@collection": persons
      "@collection2": persons
- id: C426
  name: MERGE relationship after MATCH (LPG GENERIC_WITH_TYPE)
  mapping_fixture: lpg
  extensions_enabled: false
  cypher: 'MATCH (a:User {name: "Alice"}), (b:User {name: "Bob"})
    MERGE (a)-[:FOLLOWS]->(b)

    '
  expected:
    aql: "FOR a IN @@collection\n  FILTER a[@aTypeField] == @aTypeValue\n  FILTER (a.name == \"Alice\")\n  FOR b IN @@collection2\n    FILTER b[@bTypeField] == @bTypeValue\n    FILTER (b.name == \"Bob\")\n    UPSERT {_from: a._id, _to: b._id, type: @relTypeValue}\n    INSERT {_from: a._id, _to: b._id, type: @relTypeValue}\n    UPDATE {}\n    IN @@edgeCollection\n"
    bind_vars:
      "@edgeCollection": edges
      relTypeValue: FOLLOWS
      "@collection": vertices
      aTypeField: type
      aTypeValue: User
      "@collection2": vertices
      bTypeField: type
      bTypeValue: User
- id: C427
  name: MERGE relationship with ON CREATE SET and ON MATCH SET
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'MATCH (a:Person {name: "Alice"}), (b:Person {name: "Bob"})
    MERGE (a)-[r:FOLLOWS]->(b) ON CREATE SET r.created = timestamp() ON MATCH SET r.updated = timestamp()

    '
  expected:
    aql: "FOR a IN @@collection\n  FILTER (a.name == \"Alice\")\n  FOR b IN @@collection2\n    FILTER (b.name == \"Bob\")\n    UPSERT {_from: a._id, _to: b._id}\n    INSERT {_from: a._id, _to: b._id, created: DATE_NOW()}\n    UPDATE {updated: DATE_NOW()}\n    IN @@edgeCollection\n"
    bind_vars:
      "@edgeCollection": follows
      "@collection": persons
      "@collection2": persons
# ─── CREATE extras ─────────────────────────────────────────────
- id: C430
  name: CREATE node without properties (PG)
  mapping_fixture: pg
  extensions_enabled: false
  cypher: 'CREATE (n:Person)

    '
  expected:
    aql: "INSERT {} INTO @@collection\n"
    bind_vars:
      '@collection': persons
- id: C431
  name: CREATE node without properties (LPG)
  mapping_fixture: lpg
  extensions_enabled: false
  cypher: 'CREATE (n:User)

    '
  expected:
    aql: "INSERT {type: @typeValue} INTO @@collection\n"
    bind_vars:
      '@collection': vertices
      typeValue: User
- id: C440
  name: SET and REMOVE on one variable become one UPDATE, in query order
  mapping_fixture: pg
  extensions_enabled: false
  cypher: "MATCH (n:Person {name: \"Alice\"}) SET n.age = 31 REMOVE n.nickname, n.age"
  expected:
    aql: "FOR n IN @@collection\n  FILTER (n.name == \"Alice\")\n  UPDATE n WITH {\"nickname\": null, \"age\": null} IN @@collection OPTIONS {keepNull: false}\n"
    bind_vars:
      "@collection": persons
- id: C441
  name: SET on a relationship updates the edge collection
  mapping_fixture: pg
  extensions_enabled: false
  cypher: "MATCH (a:User)-[r:FOLLOWS]->(b:User) WHERE a.name = \"Alice\" SET r.since = 2020"
  expected:
    aql: "WITH @@withCollection0, @@withCollection1, @@withCollection2, @@collection\nFOR a IN @@collection\n  FOR b, r IN 1..1 OUTBOUND a @@edgeCollection\n    FILTER (IS_SAME_COLLECTION(@bLabelColl, b))\n    FILTER (a.name == \"Alice\")\n    UPDATE r WITH {since: 2020} IN @@edgeCollection\n"
    bind_vars:
      "@collection": "users"
      "@edgeCollection": "follows"
      bLabelColl: users
      '@withCollection0': docs
      '@withCollection1': persons
      '@withCollection2': places
- id: C442
  name: DELETE a relationship removes it from the edge collection
  mapping_fixture: pg
  extensions_enabled: false
  cypher: "MATCH (a:User)-[r:FOLLOWS]->(b:User) WHERE a.name = \"Alice\" DELETE r"
  expected:
    aql: "WITH @@withCollection0, @@withCollection1, @@withCollection2, @@uCollection\nLET _matched = (\nFOR a IN @@uCollection\n  FOR b, r IN 1..1 OUTBOUND a @@edgeCollection\n    FILTER IS_SAME_COLLECTION(@vCollection, b)\n    FILTER (a.name == \"Alice\")\n    RETURN {a: a, b: b, r: r, _row: true}\n    )\n    LET _deleted_rels = UNIQUE(REMOVE_VALUE(FLATTEN(_matched[*].r._id), null))\n    LET _deleted_edges = UNIQUE(_deleted_rels)\n    FOR _id IN _deleted_edges FILTER PARSE_IDENTIFIER(_id).collection == @deleteEdgesName REMOVE PARSE_IDENTIFIER(_id).key IN @@deleteEdges\n"
    bind_vars:
      "@uCollection": users
      "@edgeCollection": follows
      vCollection: users
      "@deleteEdges": follows
      deleteEdgesName: follows
      "@withCollection0": docs
      "@withCollection1": persons
      "@withCollection2": places
- id: C443
  name: SET n = map under LPG keeps the type field
  mapping_fixture: lpg
  extensions_enabled: false
  cypher: "MATCH (n:User {name: \"Alice\"}) SET n = {name: \"Bob\"}"
  expected:
    aql: "FOR n IN @@collection\n  FILTER n[@typeField] == @typeValue\n  FILTER (n.name == \"Alice\")\n  REPLACE n WITH MERGE({name: \"Bob\"}, KEEP(n, \"type\")) IN @@collection\n"
    bind_vars:
      "@collection": vertices
      typeField: type
      typeValue: User
- id: C444
  name: CREATE then SET/REMOVE folds into the insert
  mapping_fixture: pg
  extensions_enabled: false
  cypher: "CREATE (n:Person {name: \"A\", tmp: 1}) SET n.born = 1990 REMOVE n.tmp"
  expected:
    aql: "INSERT UNSET(MERGE({name: \"A\", tmp: 1}, {born: 1990}), \"tmp\") INTO @@collection\n"
    bind_vars:
      "@collection": "persons"
- id: C445
  name: SET += with a property change merges into one UPDATE
  mapping_fixture: pg
  extensions_enabled: false
  cypher: "MATCH (n:Person {name: \"Alice\"}) SET n += $props, n.age = 30"
  params: {"props": {"x": 1}}
  expected:
    aql: "FOR n IN @@collection\n  FILTER (n.name == \"Alice\")\n  UPDATE n WITH MERGE(n, @props, {age: 30}) IN @@collection OPTIONS {keepNull: false}\n"
    bind_vars:
      props: {x: 1}
      "@collection": persons
- id: C446
  name: SET then WITH reads the written values
  mapping_fixture: pg
  extensions_enabled: false
  cypher: MATCH (n:Person) SET n.age = n.age + 1 WITH n WHERE n.age > 30 RETURN n.name AS name
  expected:
    aql: "FOR n IN @@collection\n  UPDATE n WITH {age: (IS_NUMBER(n.age) ? (n.age + 1) : (IS_STRING(n.age) ? CONCAT(n.age, 1) : (IS_ARRAY(n.age) ? PUSH(n.age, 1) : null)))} IN @@collection OPTIONS {keepNull: false}\n  LET n_new = NEW\n  FILTER (n_new.age != null AND n_new.age > 30)\n  RETURN {name: n_new.name}"
    bind_vars:
      '@collection': persons
- id: C447
  name: DELETE then WITH aggregates the deleted rows
  mapping_fixture: pg
  extensions_enabled: false
  cypher: MATCH (n:Person) WITH n, n.age AS age DELETE n WITH sum(age) AS total RETURN total
  expected:
    aql: "FOR n IN @@collection\n  LET age = n.age\n  REMOVE n IN @@collection\n  COLLECT AGGREGATE _total_sum = SUM(age)\n  LET total = NOT_NULL(_total_sum, 0)\n  RETURN total"
    bind_vars:
      '@collection': persons
